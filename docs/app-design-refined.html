bg)}.advanced{border:0;background:none;width:100%;padding:12px 0;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--secondary);min-height:52px}.advanced svg{width:16px;height:16px}.advanced-content{display:none;padding:4px 0 10px}.advanced-content.open{display:block}.advanced-content input{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px;width:100%;font-size:12px;color:var(--text)}.action-footer{padding:16px 0 0;flex:none}.primary{border:0;background:var(--accent);color:var(--bg);border-radius:14px;min-height:48px;font-size:13px;font-weight:500;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}.primary svg{width:17px;height:17px}.studio-foot{display:flex;justify-content:space-between;gap:20px;margin:26px 0 0;font-size:11px;color:#758273;line-height:1.7}.toast{display:none;position:absolute;bottom:90px;left:24px;right:24px;border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:var(--text);color:var(--bg);font-size:12px;line-height:1.6;box-shadow:0 8px 24px #0002;z-index:5}.toast.visible{display:block}.review{position:absolute;inset:auto 0 0;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:24px;box-shadow:0 -50px 100px #0004}.review h2{font-size:20px;margin:0 0 24px}.review p{font-size:12px;color:var(--secondary);margin:0 0 16px}.review dl{margin:0 0 24px;font-size:13px}.review dl div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.review dt{color:var(--secondary)}.review dd{margin:0;overflow-wrap:anywhere;max-width:65%;text-align:right}.review .primary{margin-top:12px}.short .phone{height:640px}.large .phone{font-size:18px}.large .domain strong{font-size:22px}.large .home-row strong{font-size:18px}.large .field input{font-size:19px}.large .account,.large .resource-label,.large .subhead h2,.large .setting>span,.large .primary,.large .pending,.large /* Refined resource entries and on-demand search. */
.resource-list{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.resource-entry{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:11px 2px;border:0;background:none;text-align:left}
.resource-entry+.resource-entry{border-top:1px solid var(--line)}
.resource-entry>svg:first-child{width:18px;height:18px;color:var(--secondary);stroke-width:1.5}
.resource-name{flex:1;font-size:14px}
.resource-count{font-size:13px;color:var(--secondary);font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.resource-entry>svg:last-child{width:13px;height:13px;color:var(--faint);margin-left:2px}
.list-toolbar{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 1px;min-height:46px}
.list-toolbar .filters{flex:1;margin:0;gap:22px;overflow:visible}
.list-toolbar .filter{position:relative;min-height:46px;padding:0;border:0;border-radius:0;font-size:12px;color:var(--secondary);background:transparent}
.list-toolbar .filter.selected{color:var(--text);font-weight:600}
.list-toolbar .filter.selected:after{position:absolute;content:"";height:2px;width:16px;bottom:-1px;left:calc(50% - 8px);background:var(--accent);border-radius:2px}
.search-trigger{margin-right:-10px;color:var(--secondary)}
.search-trigger svg{width:18px;height:18px}
.search-trigger[aria-expanded=true]{color:var(--accent)}
.search-wrap{display:flex;align-items:center;gap:2px;margin:8px 0 0}
.search-wrap[hidden]{display:none}
.search-wrap .search{flex:1;margin:0;min-width:0}
.search-close{margin-right:-10px;color:var(--secondary)}
.search-close svg{transform:rotate(45deg);width:19px;height:19px}
.large .resource-entry{min-height:56px}.large .resource-name{font-size:19px}.large .resource-count{font-size:17px}.large .list-toolbar .filter{font-size:15px}.large .list-toolbar .filters{gap:16px}

<body>
<main class="studio">
 <header class="studio-header"><div class="wordmark">FlareGo <span>视觉提案 · 紧凑与秩序</span></div><div class="tools"><button id="light" class="selected">浅色</button><button id="dark">深色</button><button id="size" aria-pressed="false">短屏</button><button id="font" aria-pressed="false">大字号</button></div></header>
 <div class="board" id="board"></div>
 <footer class="studio-foot"><span>三个代表页面 · 紧凑版 · 保留字体与触控空间</span><span>360 × 800 逻辑视口 · 所有数据为设计示例 · 不会执行云端操作</span></footer>
</main>
<script>
const paths={grid:'<rect x="4" y="4" width="6" height="6" rx="1.3"/><rect x="14" y="4" width="6" height="6" rx="1.3"/><rect x="4" y="14" width="6" height="6" rx="1.3"/><rect x="14" y="14" width="6" height="6" rx="1.3"/>',globe:'<circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.5" ry="8.5"/><path d="M3.5 12h17"/>',box:'<path d="m4 7 8-4 8 4v10l-8 4-8-4Zm0 0 8 4 8-4m-8 4v10M8 5l8 4"/>',card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h3"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',bolt:'<path d="m13 3-8 11h6l-1 7 9-12h-7Z"/>',db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',chevron:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m7 10 5 5 5-5"/>',back:'<path d="m14 6-6 6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',signal:'<path d="M5 19v-3m5 3v-7m5 7V8m5 11V4"/>',wifi:'<path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".5"/>',more:'<circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.chevron}</svg>`;
const status=()=>`<div class="status"><span>9:41</span><span>${icon('signal')}${icon('wifi')}<i class="battery"></i></span></div>`;
const nav=active=>`<nav class="nav" aria-label="主导航">${[['grid','总览'],['globe','域名'],['box','资源'],['card','账单'],['user','账号']].map(([i,t],n)=>`<button class="${n===active?'active':''}" ${n<2?`data-view="${n?'domains':'overview'}"`:'data-demo="此提案先展示三个代表页面。"'} ${n===active?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('')}</nav>`;
const account=()=>`<button class="account" data-demo="账号切换的视觉将在完整稿中统一。">Jim 的账号 ${icon('down')}</button>`;
const header=(title,action)=>`<div class="header"><h1>${title}</h1>${account()}${action}</div>`;
const section=(title,action='')=>`<div class="subhead"><h2>${title}</h2>${action}</div>`;
const overview=()=>`<div class="content">${header('总览','')}${section('已加载资源')}<div class="resource-list">${[['域名','6','globe','domains'],['Workers','4','bolt',''],['R2 存储','2','box',''],['KV 存储','3','db','']].map(([name,n,i,to])=>`<button class="resource-entry" ${to?`data-view="${to}"`:'data-demo="资源列表将沿用右侧域名列表的视觉。"'}>${icon(i)}<span class="resource-name">${name}</span><span class="resource-count">${n}</span>${icon('chevron')}</button>`).join('')}</div>${section('快速访问','<button data-demo="当前提案展示四项示例资源。">查看全部 '+icon('chevron')+'</button>')}<button class="home-row" data-view="record"><span><strong>example.com</strong><small>DNS 与站点设置</small></span>${icon('chevron')}</button><button class="home-row" data-demo="R2 文件列表将沿用同一套间距与字体。"><span><strong>media-assets</strong><small>R2 存储桶</small></span>${icon('chevron')}</button><button class="home-row" data-demo="Worker 详情沿用相同布局。"><span><strong>edge-api</strong><small>Worker</small></span>${icon('chevron')}</button><button class="home-row" data-demo="KV 列表沿用相同布局。"><span><strong>feature-flags</strong><small>KV 命名空间</small></span>${icon('chevron')}</button><button class="pending" data-view="domains"><span class="dot wait"></span><span>2 个域名等待激活</span>${icon('arrow')}</button></div>${nav(0)}`;
const domainData=[['example.com',true],['example.org',true],['example.net',false],['example.app',true],['example.io',true],['example.dev',false]];
const domains=()=>`<div class="content">${header('域名','<button class="icon-btn add" aria-label="添加域名" data-demo="添加域名表单将沿用右侧的分组样式。">'+icon('plus')+'</button>')}<div class="search-wrap" hidden><label class="search">${icon('search')}<input aria-label="搜索已加载的域名" placeholder="搜索域名" type="search" data-search></label><button class="icon-btn search-close" aria-label="关闭搜索" data-search-close>${icon('plus')}</button></div><div class="list-toolbar"><div class="filters" role="group" aria-label="域名状态筛选"><button class="filter selected" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="active" aria-pressed="false">已激活</button><button class="filter" data-filter="pending" aria-pressed="false">待激活</button></div><button class="icon-btn search-trigger" data-search-toggle aria-label="搜索域名" aria-expanded="false" title="搜索域名">${icon('search')}</button></div><div class="domain-list">${domainData.map(([name,active])=>`<button class="domain" data-state="${active?'active':'pending'}" ${active?'data-view="record"':'data-demo="等待将名称服务器切换到 Cloudflare。"'}><span><strong>${name}</strong><span class="domain-status"><i class="dot ${active?'':'wait'}"></i>${active?'已激活':'等待名称服务器'}</span></span>${icon('chevron')}</button>`).join('')}</div><p class="empty" hidden>没有匹配的域名</p></div>${nav(1)}`;
const record=()=>`<div class="detail-top"><button class="icon-btn" aria-label="返回域名" data-view="domains">${icon('back')}</button><span>编辑记录</span><button class="icon-btn" aria-label="更多选项" data-demo="更多选项的范围将在完整流程稿中展示。">${icon('more')}</button></div><div class="content"><div class="record-heading"><span class="type-symbol">A</span><div><h1>api.example.com</h1><p>example.com</p></div></div><div class="form-group"><label class="field"><span>名称</span><input name="record-name" value="api" spellcheck="false" autocomplete="off" aria-label="记录名称"></label><label class="field"><span>IPv4 地址</span><input class="mono" name="record-value" value="192.0.2.10" spellcheck="false" autocomplete="off" aria-label="IPv4 地址"></label><div class="field static"><span>TTL</span><strong>自动</strong></div></div><label class="setting"><span>Cloudflare 代理<small data-proxy-label>通过 Cloudflare 网络访问</small></span><input type="checkbox" class="switch" checked role="switch" aria-label="Cloudflare 代理"></label><button class="advanced" aria-expanded="false">备注 ${icon('plus')}</button><div class="advanced-content"><input aria-label="备注" placeholder="添加备注（可选）"></div><div class="action-footer"><button class="primary" data-review>预览变更 ${icon('arrow')}</button></div></div>`;
const templates={overview,domains,record};
const titles={overview:['01','总览'],domains:['02','资源列表 · 域名'],record:['03','编辑详情 · DNS']};
document.querySelector('#board').innerHTML=Object.entries(titles).map(([id,[num,title]])=>`<section class="panel" data-panel="${id}"><div class="caption"><span>${title}</span><em>${num}</em></div><article class="phone ${id==='record'?'detail':''}" data-page="${id}">${status()}${templates[id]()}<div class="gesture"></div><div class="toast" role="status"></div></article></section>`).join('');
function renderPhone(phone,id){phone.dataset.page=id;phone.classList.toggle('detail',id==='record');phone.innerHTML=status()+templates[id]()+'<div class="gesture"></div><div class="toast" role="status"></div>'}
function toast(phone,message){const el=phone.querySelector('.toast');el.textContent=message;el.classList.add('visible');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.remove('visible'),3200)}
function toggleSearch(phone,open){const wrap=phone.querySelector('.search-wrap'),input=phone.querySelector('[data-search]'),trigger=phone.querySelector('[data-search-toggle]');wrap.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(open){input.focus()}else{input.value='';filter(phone);trigger.focus()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.matches('[data-search]')){e.preventDefault();toggleSearch(e.target.closest('.phone'),false)}});
function filter(phone){const q=phone.querySelector('[data-search]').value.toLowerCase(),state=phone.querySelector('.filter.selected').dataset.filter;let visible=0;phone.querySelectorAll('.domain').forEach(el=>{const show=el.textContent.toLowerCase().includes(q)&&(state==='all'||el.dataset.state===state);el.hidden=!show;el.style.display=show?'flex':'none';if(show)visible++});phone.querySelector('.empty').hidden=visible!==0}
document.addEventListener('input',e=>{if(e.target.matches('[data-search]'))filter(e.target.closest('.phone'));if(e.target.matches('.switch'))e.target.closest('.phone').querySelector('[data-proxy-label]').textContent=e.target.checked?'通过 Cloudflare 网络访问':'仅提供 DNS 解析'});
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const phone=btn.closest('.phone');if(btn.hasAttribute('data-search-toggle')){toggleSearch(phone,btn.getAttribute('aria-expanded')!=='true');return}if(btn.hasAttribute('data-search-close')){toggleSearch(phone,false);return}if(btn.dataset.view){renderPhone(phone,btn.dataset.view);return}if(btn.dataset.demo){toast(phone,btn.dataset.demo);return}if(btn.dataset.filter){phone.querySelectorAll('.filter').forEach(b=>{const on=b===btn;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});filter(phone)}if(btn.matches('.advanced')){const open=btn.getAttribute('aria-expanded')!=='true';btn.setAttribute('aria-expanded',String(open));phone.querySelector('.advanced-content').classList.toggle('open',open)}if(btn.hasAttribute('data-review')){const sheet=document.createElement('div');sheet.className='review';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','变更预览');sheet.innerHTML='<h2>变更预览</h2><p>设计预览，不会提交到 Cloudflare。</p><dl></dl><button class="primary" data-close>返回编辑</button>';const values=[['名称',phone.querySelector('[name="record-name"]').value],['IPv4 地址',phone.querySelector('[name="record-value"]').value],['代理',phone.querySelector('.switch').checked?'开启':'关闭']];values.forEach(([label,value])=>{const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);sheet.querySelector('dl').append(row)});phone.append(sheet);sheet.querySelector('button').focus()}if(btn.hasAttribute('data-close')){btn.closest('.review').remove();phone.querySelector('[data-review]').focus()}});
function theme(dark){document.body.classList.toggle('dark',dark);document.querySelector('#dark').classList.toggle('selected',dark);document.querySelector('#light').classList.toggle('selected',!dark)}
document.querySelector('#dark').onclick=()=>theme(true);document.querySelector('#light').onclick=()=>theme(false);
for(const [id,cls]of [['size','short'],['font','large']])document.getElementById(id).onclick=e=>{const on=document.body.classList.toggle(cls);e.target.classList.toggle('selected',on);e.target.setAttribute('aria-pressed',String(on))};
const params=new URLSearchParams(location.search);if(params.get('theme')==='dark')theme(true);if(params.has('solo')){const id=params.get('solo');if(templates[id]){document.body.classList.add('solo');document.querySelector(`[data-panel="${id}"]`).classList.add('chosen')}}
window.preview={theme,renderPhone};
</script>
</body>
</html>
