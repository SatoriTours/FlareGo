.details{margin:12px 0 0;padding:12px 0;border-top:1px solid var(--line);font-size:12px}.details summary{min-height:28px;line-height:1.8;color:var(--muted)}.details p{font-size:12px;line-height:1.7}.details .form-group{margin-top:12px}.check-row{font-size:12px;line-height:1.75;margin:16px 0}.check-row input{accent-color:var(--primary)}

.primary,.secondary,.danger-action{font-size:13px;min-height:48px;border-radius:14px;padding:12px 16px;font-weight:500;line-height:1.6}.secondary{border-color:var(--line);color:var(--text)!important}.danger-action{border-color:var(--line);color:var(--error)!important}.link{font-size:12px;min-height:44px}.footer{padding:16px 20px 8px}.scroll>.footer{padding:16px 0 0;background:transparent}.footer .split{gap:10px}.row+.primary,.row+.secondary{margin-top:16px}
.number-panel{background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 0;border-radius:0}.number-panel .hero{font-size:28px;font-weight:500;margin:8px 0;letter-spacing:-.6px}.hero{font-size:26px;font-weight:500;line-height:1.3}.hero small{font-size:12px}.metric strong{font-size:22px}
.code{font-size:12px;line-height:1.75;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);margin:12px 0}.table-wrap{margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.phone th,.phone td{padding:11px 12px;font-size:12px}.phone th{background:var(--soft);font-weight:500}.phone tbody tr:last-child td{border-bottom:0}
.diff{margin:16px 0;padding-top:12px}.diff .before{font-size:12px}.diff .after{font-size:14px}.line-actions{gap:8px;margin:12px 0}.line-actions .secondary{padding:10px;min-width:0}
.center-content{padding:24px 20px;justify-content:center}.focus{padding:0 0 28px}.focus h2{font-size:23px;letter-spacing:-.4px;font-weight:500;line-height:1.45;margin-bottom:10px}.focus .primary,.focus .secondary{margin-top:24px;font-size:14px}.privacy{border:0;margin:0;padding:0}.privacy summary{font-size:11px;text-align:center}.spinner{width:20px;height:20px}.progress-title{gap:10px}.progress-title h2{margin:0}.skeleton{height:13px;margin:24px 0;background:var(--soft)}
.bottom-nav{height:68px;align-items:center;padding:5px 12px 0}.bottom-nav button{position:relative;height:58px;font-size:10px;color:var(--faint);gap:5px}.bottom-nav .navicon{width:24px;height:24px;background:transparent!important}.bottom-nav svg{width:21px;height:21px}.bottom-nav button.selected{color:var(--primary)}.bottom-nav button.selected:before{content:"";position:absolute;top:-6px;left:calc(50% - 8px);width:16px;height:2px;border-radius:2px;background:var(--primary)}.gesture{height:22px}.gesture:after{width:90px;height:4px;opacity:.65}
.sheet .phone{box-shadow:0 0 0 1px #1835230a,0 16px 30px -20px #213a2b40}.solo .phone{border-radius:0}.sheet-label{color:#596c5d}.gallery-heading p{color:#718074}.tag{background:#dce5d8;color:#284a36}.inspector-card button{border-radius:10px}.inspector-card{border-color:#d6ddd2}

<body>
<header class="studio-head"><div><strong>FlareGo</strong><span>全页面设计 · 仅预览</span></div><div class="tools"><select id="viewport" aria-label="参考屏幕"><option value="800">20:9 · 360 × 800</option><option value="640">短屏 · 360 × 640</option></select><button id="theme" aria-pressed="false">浅色</button><button id="font" aria-pressed="false">大字号</button><button id="gallery">页面总览</button></div></header>
<div class="workspace"><aside class="catalog"><label class="catalog-search">查找页面<input id="filter" placeholder="名称 / 功能" type="search"></label><div id="page-count"></div><nav id="catalog" aria-label="设计稿目录"></nav></aside><main id="stage"></main><aside id="inspector"></aside></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>'use strict';
// Local design prototype only. All names, values and results below are synthetic.
const UI='shared-ui/src/commonMain/kotlin/com/flarego/ui/';
const groups={home:'总览与导航',connect:'连接账号',zones:'域名管理',dns:'DNS 管理',security:'安全与站点设置',workers:'Workers',r2:'R2 存储',kv:'KV 存储',d1:'D1 数据库',billing:'账单',account:'账号与更新',tasks:'操作记录',states:'通用状态',demo:'演示与官方入口'};
const sources={home:['Screens.kt','FlareGoApp.kt','ServiceSetup.kt'],connect:['OAuthConnectionDialog.kt','OAuthConnection.kt'],zones:['zones/ZonePage.kt','zones/ZoneForm.kt'],dns:['dns/DnsPage.kt','dns/DnsRecordForm.kt','dns/DnsBatchPanel.kt','dns/DnsFilesPanel.kt','dns/DnsScanPanel.kt','dns/DnsZoneSettingsPanel.kt'],security:['dns/DnssecPanel.kt','zones/ZoneSettingsPanel.kt'],workers:['Screens.kt'],r2:['r2/R2BrowserHost.kt','r2/R2BucketList.kt','r2/R2ObjectList.kt','r2/R2ConfigurationScreen.kt','r2/R2CScreen.kt'],kv:['kv/KvBrowserHost.kt'],d1:['d1/D1BrowserHost.kt'],billing:['Screens.kt'],account:['Screens.kt','UpdatePanel.kt','Forms.kt'],tasks:['Screens.kt','kv/KvBrowserHost.kt','d1/D1BrowserHost.kt'],states:['Components.kt','Screens.kt'],demo:['Purchase.kt','Forms.kt']};
const paths={back:'<path d="M20 12H4m7-7-7 7 7 7"/>',chevron:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>',box:'<path d="m3 7 9-4 9 4v10l-9 4-9-4Zm0 0 9 4 9-4M12 11v10"/>',card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-14 5h4"/>',cloud:'<path d="M6 18a5 5 0 1 1 .7-9.95A6.5 6.5 0 0 1 19.4 10 4 4 0 0 1 19 18Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',check:'<path d="m5 12 4 4L19 6"/>',external:'<path d="M14 4h6v6m0-6-9 9M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',refresh:'<path d="M20 10a8 8 0 1 0-1 8M20 4v6h-6"/>',signal:'<path d="M4 19v-3m5 3v-7m5 7V8m5 11V4"/>'};
paths.user='<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>';
paths.arrow='<path d="M5 12h14m-5-5 5 5-5 5"/>';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.chevron}</svg>`;
const goAttr=id=>id?`data-go="${esc(id)}"`:'data-demo="此处为设计预览，不会向云端发送请求。"';
const btn=(label,id,kind='primary')=>`<button class="${kind}" ${goAttr(id)}>${label}</button>`;
const action=(label,id)=>({label,id});
const row=(label,sub='',id='',right='')=>`<${id?'button':'div'} class="row" ${id?goAttr(id):''} ${id?`data-action-label="${esc(label)}"`:''}><span class="label">${label}${sub?`<span class="sub">${sub}</span>`:''}</span>${right?`<span class="value">${right}</span>`:''}${id?icon('chevron'):''}</${id?'button':'div'}>`;
const badge=(s,cls='')=>`<span class="badge ${cls}">${s}</span>`;
const section=(title,link='',id='')=>`<div class="section"><span>${title}</span>${link?`<button ${goAttr(id)}>${link}</button>`:''}</div>`;
const muted=s=>`<p class="muted">${s}</p>`;
const note=(s,cls='')=>`<div class="notice ${cls}">${s}</div>`;
const details=(title,text)=>`<details class="details"><summary>${title}</summary><p>${text}</p></details>`;
const field=(label,value='',type='text',hint='')=>`<label class="field"><span>${label}</span>${type==='textarea'?`<textarea spellcheck="false">${esc(value)}</textarea>`:type.startsWith('select:')?`<select>${type.slice(7).split('|').map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input type="${type}" value="${esc(value)}" autocomplete="off" spellcheck="false">`}${hint?`<small>${hint}</small>`:''}</label>`;
const toggle=(label,on=false)=>`<label class="switch-row"><span>${label}</span><input aria-label="${label}" type="checkbox" role="switch" ${on?'checked':''}></label>`;
const check=(label,gate=false)=>`<label class="check-row"><input type="checkbox" ${gate?'data-gate-check':''}><span>${label}</span></label>`;
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const code=s=>`<pre class="code">${esc(s)}</pre>`;
const tabs=(items,active)=>`<div class="tabs">${items.map(([label,id])=>`<button class="${id===active?'active':''}" ${goAttr(id)}>${label}</button>`).join('')}</div>`;
const search=placeholder=>`<div class="search-module"><div class="search-editor" hidden><label class="search">${icon('search')}<input type="search" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" data-local-filter></label><button class="icon-button close-search" data-close-search aria-label="关闭搜索">${icon('plus')}</button></div><div class="list-tools"><button class="icon-button search-trigger" data-toggle-search aria-expanded="false" aria-label="${esc(placeholder)}">${icon('search')}</button></div></div>`;
const context=(s='Jim 的账号')=>`<div class="context"><button data-go="account-switch">${s} ⌄</button><span>刚刚更新</span></div>`;
const diff=(label,before,after)=>`<div class="diff"><span class="tiny">${label}</span><div class="before">${before}</div><div class="after">${after}</div></div>`;
const focus=(title,desc='',label='',target='')=>`<div class="focus"><h2>${title}</h2>${desc?muted(desc):''}${label?btn(label,target):''}</div>`;
const privacy=`<details class="details privacy"><summary>权限与隐私 ›</summary><p>仅访问你授权的功能。凭据加密保存在本机；可在 Cloudflare 撤销授权。</p></details>`;
const resourceTabs=active=>tabs([['Workers','workers'],['R2','r2'],['KV','kv'],['D1','d1']],active);
const zoneTabs=active=>tabs([['概况','zone'],['DNS','dns'],['设置','site-settings'],['安全','dnssec']],active);
const pages=[];
function add(id,group,title,body,opt={}){pages.push({id,group,title,body,back:opt.root?null:opt.back||'overview',sources:opt.sources||sources[group],intent:opt.intent||'减少重复说明，将当前内容和主要操作放在同一层级。',boundary:opt.boundary||'依据当前工作区入口设计；展示数据均为示例，能力与真实权限以 App 实现为准。',...opt})}
function form(id,group,title,body,back,next='change-review',opt={}){add(id,group,title,body,{back,form:true,footer:btn('预览变更',next),intent:'单列表单，标签始终可见；字段校验就地显示，预览与提交分开。',...opt})}
function confirm(id,group,title,body,back,opt={}){add(id,group,title,body,{back,footer:`<div class="split">${btn('返回编辑',back,'secondary')}${btn('确认提交',null)}</div>`,intent:'明确当前目标与变更内容；保留现有独立确认流程。',...opt})}
// Primary navigation and account context.
const resourceEntry=(name,count,i,to)=>`<button class="resource-entry" ${goAttr(to)}>${icon(i)}<span>${name}</span><small>${count}</small>${icon('chevron')}</button>`;
add('overview','home','总览',()=>section('已加载资源')+`<div class="resource-list">${resourceEntry('域名','6','globe','domains')}${resourceEntry('Workers','4','cloud','workers')}${resourceEntry('R2 存储','2','box','r2')}${resourceEntry('KV 存储','3','grid','kv')}${resourceEntry('D1 数据库','2','box','d1')}</div>`+section('快速访问','操作记录','jobs')+row('example.com','DNS 与站点设置','zone')+row('media-assets','R2 存储桶','r2-objects')+row('app-config','KV 命名空间','kv-keys')+`<button class="pending-line" data-go="jobs-pending"><i></i><span>1 项操作待核对</span>${icon('arrow')}</button>`,{root:'overview',intent:'常用资源是紧凑入口，数量靠右弱化；不叠加总数卡片。待核对操作单独保留。',boundary:'数量为已加载列表的示例计数，不能当作账号全量。所有数据均为合成示例。'});
add('first','home','总览',()=>focus('添加你的云账号','','连接 Cloudflare','connect'),{root:'overview',center:true,intent:'首次进入只保留连接入口，其余 Tab 仍可访问。'});
add('account-switch','home','切换账号',()=>section('Cloudflare')+row('Jim 的账号','当前使用','overview',badge('当前'))+row('FlareGo 团队','已连接','overview')+btn('添加账号','connect','secondary'),{back:'overview',intent:'将原抽屉整理为账号选择页；切换保留当前功能分类，关闭旧账号详情。',boundary:'原生实施时保留账号隔离语义；此原型的切换仅跳转示例。其他厂商不作为可连接入口。'});
add('search','home','搜索域名',()=>search('搜索已加载的域名')+row('example.com','已激活 · DNS 托管','zone')+row('example.net','等待激活','zone-activation'),{back:'domains',intent:'搜索与结果同屏，明确作用于当前列表；不新增假全局搜索。'});
add('create-resource','home','创建资源',()=>row('R2 存储桶','对象存储','r2-create')+row('KV 命名空间','键值存储','kv-create')+row('D1 数据库','SQL 数据库','d1-create')+section('官方控制台')+row('Workers','在 Cloudflare 中部署','worker-console'),{back:'workers'});
// Approved minimal connection direction.
add('connect','connect','添加账号',()=>focus('连接 Cloudflare','在浏览器中完成授权','前往授权','connect-wait'),{center:true,back:'accounts',footer:privacy});
add('connect-wait','connect','添加账号',()=>`<div class="focus"><div class="progress-title"><span class="spinner"></span><h2>等待授权</h2></div>${muted('完成授权后返回这里')}${btn('继续授权','connect-loading')}</div>`,{center:true,back:'accounts',boundary:'原型点击进入连接状态以供查看；正式版必须等待真实 OAuth 回调。'});
add('connect-loading','connect','添加账号',()=>`<div class="focus"><div class="progress-title"><span class="spinner"></span><h2>正在连接</h2></div>${muted('正在读取账号…')}</div>`,{center:true,back:'accounts',related:['connect-saving','connect-choose','connect-error']});
add('connect-saving','connect','添加账号',()=>`<div class="focus"><div class="progress-title"><span class="spinner"></span><h2>正在连接</h2></div>${muted('正在保存连接…')}</div>`,{center:true,back:'accounts',locked:true});
add('connect-choose','connect','选择账号',()=>row('Jim 的账号','','connect-saving')+row('FlareGo 团队','','connect-saving'),{back:'accounts',footer:btn('重新授权','connect','link')});

// A form's preview uses that form's target and visible values. The catalogue also
// exposes standalone examples of each confirmation stage for design review.
const reviewEntries=new Set(['change-review','r2-review','r2-config-review','zone-preview','kv-confirm-risk','d1-confirm-risk','danger-risk','dns-preview']);
const reviewLater=new Set(['kv-confirm-identity','kv-confirm-final','d1-confirm-identity','d1-confirm-final','danger-identity','danger-final']);
const drafts=new Map();let activeReview=null;
function captureReview(page,phone,entry,trigger){
 const fields=Array.from(phone.querySelectorAll('.field')).map(f=>{
  const el=f.querySelector('input,select,textarea');return [f.querySelector('span')?.textContent||'字段',el?.type==='password'?'已隐藏':el?.value||'未填写'];
 });
 phone.querySelectorAll('.switch-row').forEach(f=>fields.push([f.querySelector('span').textContent,f.querySelector('input').checked?'开启':'关闭']));
 const get=k=>fields.find(x=>x[0]===k)?.[1];
 const deletion=trigger?.dataset.actionLabel?.startsWith('删除');
 const title=deletion?trigger.dataset.actionLabel:page.id==='r2-job-create'?(get('操作')||page.title):page.title;
 const creating=['kv-create','r2-create','d1-create','zone-create'].includes(page.id);
 const targets={zones:'example.com',dns:'example.com',security:'example.com',r2:'media-assets',kv:'app-config',d1:'app-db'};
 const target=page.id==='r2-domain-edit'?'cdn.example.com':page.id==='kv-value'?'app-config / site:title':creating?(get('数据库名称')||get('名称')||get('域名')||'待填写名称'):targets[page.group]||'media-assets';
 const identity=page.group==='d1'?(creating?'0123456789abcdef0123456789abcdef':'11111111-2222-3333-4444-555555555555'):page.group==='kv'?'namespace-example-id':target;
 const identityLabel=page.group==='d1'?(creating?'账号 ID':'数据库 UUID'):page.group==='kv'?'命名空间 ID':page.id==='r2-domain-edit'?'域名':['zones','dns','security'].includes(page.group)?'域名':'存储桶名';
 const danger=/删除|清空/.test(title);
 const fast=page.id==='kv-create'||page.id==='kv-rename';
 return {origin:page.id,title,group:page.group,fields:deletion?[]:fields,target,identity,identityLabel,danger,fast,entry};
}
function reviewPresentation(p){
 const r=activeReview;if(!r||(!reviewEntries.has(p.id)&&!reviewLater.has(p.id)))return p;
 const identity=p.id.endsWith('-identity');
 const final=p.id.endsWith('-final')||r.fast;
 const chain=r.entry==='kv-confirm-risk'?'kv-confirm':r.entry==='d1-confirm-risk'?'d1-confirm':r.entry==='danger-risk'?'danger':null;
 let body=row('账号','','','Jim 的账号')+row('操作','','',esc(r.title))+row('目标','','',esc(r.target));
 if(identity){body+=code(r.identity)+`<label class="field"><span>输入完整${r.identityLabel}</span><input data-match="${esc(r.identity)}" autocomplete="off"></label>`;
  return {...p,title:'核对目标身份',back:r.entry,body:()=>body,gate:true,footer:btn('继续',chain+'-final')};}
 if(r.group==='d1'||r.group==='kv'&&!r.fast)body+=row(r.identityLabel,'','',r.identity);
 body+=r.fields.map(([k,v])=>/SQL|JSON|内容|值/.test(k)?section(esc(k))+code(v):row(esc(k),'','',esc(v))).join('');
 const checks=[];
 if(r.origin==='r2-job-create'&&r.danger){body+=note('将删除匹配范围内的对象。','error');checks.push('已在外部中止分段上传并暂停写入');}
 if(r.origin==='r2-public'&&r.fields.some(x=>x[0]==='开启公开访问'&&x[1]==='开启')){body+=note('开启后可通过公开地址访问桶内对象。');checks.push('确认公开访问影响');}
 if(['r2-cors-edit','r2-lifecycle-edit','r2-lock'].includes(r.origin)){body+=note('将替换本次完整规则集。');checks.push('已核对全部规则');}
 if(r.origin==='universal-ssl'&&r.fields.some(x=>x[0]==='Universal SSL'&&x[1]==='关闭')){body+=note('关闭后可能影响使用该证书的访问。');checks.push('确认关闭证书的影响');}
 if(!r.danger&&(r.origin==='ssl'||r.origin==='site-setting-edit'||r.origin==='r2-domain-edit')){body+=note('若降低协议或加密级别，会影响连接安全。');checks.push('已核对本次安全设置变更');}
 if(r.danger&&r.origin==='r2-domain-edit'){body+=note('移除该域名与存储桶的关联，域名访问将受影响。','error');checks.push('确认移除此域名');}
 if(r.danger&&r.origin==='dnssec-edit'){body+=note('删除前请核对注册商 DS，避免解析验证失败。','error');checks.push('已核对注册商 DS 配置');}
 if(r.danger&&r.origin==='r2-notifications'){body+=note('将删除此桶的通知配置，后续事件不再发送到相关队列。','error');checks.push('已核对通知配置范围');}
 if(r.group==='d1'){body+=note(r.danger?'将删除数据库及其中数据。':'请核对数据库与完整操作内容。');}
 if(r.group==='kv'&&!r.fast){body+=note(r.danger?'将删除所选范围的键及内容。':'写入会影响已有值与到期设置。');}
 if(r.origin==='dns-replace')body+=note('本次为完整替换，请核对全部字段。');
 if(!final&&(chain||checks.length)){checks.push('我已核对本次全部目标与内容');body+=checks.map(x=>check(x,true)).join('');}
 const footer=!final&&chain?btn('继续',chain+'-identity'):`<div class="split">${btn('返回编辑',r.origin,'secondary')}${btn(r.danger?'确认删除':'确认提交',null,r.danger?'danger-action':'primary')}</div>`;
 return {...p,title:final?'最终确认':'确认变更',back:final&&chain&&!r.fast?chain+'-identity':r.origin,body:()=>body,footer,gate:!final&&(!!chain||checks.length>0)};
}
// Curated boards include both everyday surfaces and deep management workflows.
const boards={
 main:{name:'五个主页面',ids:['overview','domains','workers','billing','accounts']},
 connect:{name:'账号连接',ids:['connect','connect-loading','connect-choose','connect-error']},
 domains:{name:'域名与 DNS',ids:['zone','dns','dns-edit','dns-preview','dns-batch','dns-files','dns-scan-review','dns-settings']},
 security:{name:'安全与站点',ids:['site-settings','site-options','ssl','dnssec','dnssec-ds','purge','purge-confirm','readonly']},
 r2:{name:'R2 对象与配置',ids:['r2','r2-objects','r2-object','r2-upload','r2-config','r2-cors-edit','r2-lifecycle-edit','r2-public']},
 r2more:{name:'R2 集成与作业',ids:['r2-lock','r2-domains','r2-sippy','r2-sippy-edit','r2-jobs','r2-notifications','r2-metrics','r2-delete-bucket']},
 kv:{name:'KV 管理',ids:['kv','kv-keys','kv-value','kv-edit','kv-bulk-write','kv-confirm-risk','kv-confirm-identity','kv-confirm-final']},
 d1:{name:'D1 管理',ids:['d1','d1-database','d1-schema','d1-rows','d1-sql','d1-confirm-risk','d1-results','d1-settings']},
 account:{name:'账单、账号与任务',ids:['bill-detail','billing-unavailable','account-detail','updates','jobs','task-unknown','task-manual','disconnect']},
 states:{name:'状态与恢复',ids:['first','empty','loading','read-error','permission','pagination-error','field-error','conflict']}
};
const pageMap=new Map(pages.map(p=>[p.id,p]));
const nav=[['overview','总览','grid'],['domains','域名','globe'],['workers','资源','box'],['billing','账单','card'],['accounts','账号','user']];
let current='overview',galleryMode=false,boardKey='main',historyStack=[],toastTimer;
const params=new URLSearchParams(location.search);
function notify(text){const t=document.querySelector('#toast');t.textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.textContent='',3500)}
function frame(p){
 p=reviewPresentation(p);const body=p.body(),root=!!p.root;
 const left=root?'':`<button class="icon-button" ${goAttr(p.back)} aria-label="返回" ${p.locked?'disabled':''}>${icon('back')}</button>`;
 const account=root&&!['accounts','first'].includes(p.id)?`<button class="account-chip" data-go="account-switch">Jim 的账号 ${icon('down')}</button>`:'';
 const action=p.top?`<button class="${root&&['添加','创建'].includes(p.top.label)?'icon-button add-action':'top-action'}" ${goAttr(p.top.id)} aria-label="${p.top.label}">${root&&['添加','创建'].includes(p.top.label)?icon('plus'):p.top.label}</button>`:'';
 const footer=p.footer?`<div class="footer">${p.footer}</div>`:'';
 const html=`<div class="phone ${root?'root-phone':''}" data-page="${p.id}" data-gated="${p.gate?1:0}"><div class="status"><span>9:41</span><span class="system">${icon('signal')}<span class="battery"></span></span></div><div class="topbar ${root?'root-topbar':''}">${left}<h1>${p.title}</h1>${account}${action}</div><div class="scroll ${p.center?'center-content':''}" tabindex="0" aria-label="${p.title}内容">${body}${p.center?'':footer}</div>${p.center?footer:''}${root?`<nav class="bottom-nav" aria-label="主导航">${nav.map(([id,label,i])=>`<button ${goAttr(id)} class="${(p.root==='resources'?id==='workers':id===p.root)?'selected':''}"><span class="navicon">${icon(i)}</span>${label}</button>`).join('')}</nav>`:''}<div class="gesture"></div></div>`;
 return polishFrame(html,p);
}
function polishFrame(html,p){
 const template=document.createElement('template');template.innerHTML=html;
 const phone=template.content.querySelector('.phone'),scroll=phone.querySelector('.scroll');
 if(p.root)scroll.querySelectorAll('.context').forEach(e=>{if(e.querySelector('button'))e.remove()});
 // Adjacent fields share one quiet surface; section and risk boundaries remain intact.
 for(const parent of [scroll,...scroll.querySelectorAll('.details')]){
  for(const field of [...parent.children]){if(field.parentElement!==parent||!field.matches('.field'))continue;const group=document.createElement('div');group.className='form-group';field.before(group);let next=field;while(next?.matches('.field')){const following=next.nextElementSibling;group.append(next);next=following}}
 }
 const module=scroll.querySelector('.search-module');
 if(module){
  const tools=module.querySelector('.list-tools'),trigger=module.querySelector('[data-toggle-search]');
  const adjacent=module.nextElementSibling?.matches('.tabs')?module.nextElementSibling:module.previousElementSibling?.matches('.tabs')?module.previousElementSibling:null;
  if(adjacent){tools.prepend(adjacent)}else{phone.querySelector('.topbar').append(trigger);tools.remove()}
  let next=module.nextElementSibling;while(next&&(!next.matches('.section,.details,.form-group')||p.id==='jobs'&&next.matches('.section'))){if(next.matches('.section'))next.dataset.filterHeading='';if(next.matches('.row'))next.dataset.filterRow='';next.querySelectorAll('.row').forEach(row=>row.dataset.filterRow='');next=next.nextElementSibling}
  const empty=document.createElement('p');empty.className='search-empty';empty.hidden=true;empty.textContent='没有匹配结果';module.after(empty);
  if(['search','no-results'].includes(p.id)){module.querySelector('.search-editor').hidden=false;trigger.setAttribute('aria-expanded','true')}
 }
 return template.innerHTML;
}
function applyListFilter(phone){
 const q=phone.querySelector('[data-local-filter]')?.value.trim().toLowerCase()||'',state=phone.querySelector('[data-status-filter].active')?.dataset.statusFilter||'all';let visible=0;
 phone.querySelectorAll('[data-filter-row]').forEach(row=>{row.hidden=!!q&&!row.textContent.toLowerCase().includes(q)||state!=='all'&&row.dataset.domainState!==state;if(!row.hidden)visible++});
 phone.querySelectorAll('[data-filter-heading]').forEach(heading=>{let next=heading.nextElementSibling,hasVisible=false;while(next&&!next.matches('.section')){if(next.matches('[data-filter-row]')&&!next.hidden)hasVisible=true;next=next.nextElementSibling}heading.hidden=!hasVisible});
 const empty=phone.querySelector('.search-empty');if(empty)empty.hidden=visible!==0||!phone.querySelector('[data-filter-row]');
}
function toggleSearch(phone,open){
 const editor=phone.querySelector('.search-editor'),input=phone.querySelector('[data-local-filter]'),trigger=phone.querySelector('[data-toggle-search]');
 editor.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(open){input.focus()}else{input.value='';applyListFilter(phone);trigger.focus()}
}
function gatePhones(){document.querySelectorAll('.phone').forEach(phone=>{
 const p=pageMap.get(phone.dataset.page);if(phone.dataset.gated!=='1'&&!p?.invalid)return;
 const inputs=[...phone.querySelectorAll('[data-gate-check],[data-match]')];
 const valid=!p.invalid&&inputs.length>0&&inputs.every(i=>i.hasAttribute('data-match')?i.value===i.dataset.match:i.checked);
 phone.querySelectorAll('.footer .primary,.footer .danger-action').forEach(b=>b.disabled=!valid);
})}
function saveDraft(phone){if(!phone)return;drafts.set(phone.dataset.page,[...phone.querySelectorAll('input,textarea,select')].map(e=>({value:e.type==='password'?'':e.value,checked:e.checked})))}
function restoreDraft(phone){const values=drafts.get(phone.dataset.page);if(!values)return;phone.querySelectorAll('input,textarea,select').forEach((e,i)=>{if(values[i]){e.value=values[i].value;e.checked=values[i].checked}});if(phone.querySelector('[data-local-filter]')?.value){toggleSearch(phone,true);applyListFilter(phone)}}
function renderCatalog(){
 const q=document.querySelector('#filter').value.toLowerCase();
 document.querySelector('#page-count').textContent=`${pages.length} 个页面与状态 · 全部为设计示例`;
 document.querySelector('#catalog').innerHTML=Object.entries(groups).map(([g,label])=>{
  const ps=pages.filter(p=>p.group===g&&(!q||`${p.title} ${p.id} ${label}`.toLowerCase().includes(q)));
  return ps.length?`<details ${q||pageMap.get(current)?.group===g?'open':''}><summary>${label}<span>${ps.length}</span></summary>${ps.map(p=>`<button data-catalog="${p.id}" class="${p.id===current?'active':''}">${p.title}${p.mode?' · '+p.mode:''}</button>`).join('')}</details>`:'';
 }).join('')+`<button data-coverage>页面覆盖清单</button>`;
}
function inspector(p){return `<div class="inspector-card"><span class="tag ${p.mode?'warn':''}">${p.mode||'当前入口重设计'}</span><h2>${p.title}</h2><p>${p.intent}</p><h3>能力边界</h3><p>${p.boundary}</p><h3>对应源码</h3>${p.sources.map(s=>`<p><code>${esc(s)}</code></p>`).join('')}</div><div class="inspector-card"><h3>浏览方式</h3><p>点击页面中的列表、按钮和底部导航，查看相关画面。不会连接 Cloudflare、上传文件或执行操作。请勿填写真实凭据。</p><p>20:9 是参考比例，2K 导出为 1440 × 3200；实际 App 还需原生字体、系统缩放和安全区验收。</p>${p.related?'<h3>相关状态</h3>'+p.related.map(id=>`<button data-catalog="${id}">${pageMap.get(id)?.title||id}</button>`).join(''):''}<button data-coverage>页面覆盖清单</button></div>`}
function renderPage(id,push=true){
 const p=pageMap.get(id)||pageMap.get('overview');if(push&&current!==p.id)historyStack.push(current);current=p.id;galleryMode=false;document.body.classList.remove('gallery-mode');
 document.querySelector('#stage').innerHTML=`<div class="stage-label"><span>${groups[p.group]} / ${p.title}</span><span>示例数据 · ${pages.indexOf(p)+1}/${pages.length}</span></div>${frame(p)}`;
 document.querySelector('#inspector').innerHTML=inspector(p);renderCatalog();restoreDraft(document.querySelector('.phone'));gatePhones();
 if(!document.body.classList.contains('solo'))location.hash=p.id;
}
function renderBoard(key=boardKey){
 activeReview=null;boardKey=boards[key]?key:'main';galleryMode=true;document.body.classList.add('gallery-mode');const b=boards[boardKey];
 window.scrollTo(0,0);document.querySelector('#stage').scrollLeft=0;document.querySelector('#stage').innerHTML=`<div class="gallery-heading"><div><h2>${b.name}</h2><p>FlareGo · 全页面视觉提案 · 示例数据，不代表真实云端状态</p></div><select id="board-select" aria-label="设计分组">${Object.entries(boards).map(([k,v])=>`<option value="${k}" ${k===boardKey?'selected':''}>${v.name}</option>`).join('')}</select></div><div class="sheet ${boardKey==='main'?'five':''}">${b.ids.map(id=>{const p=pageMap.get(id);return `<article class="sheet-item"><div class="sheet-label"><span>${p.title}</span><button data-catalog="${id}">单页查看 ↗</button></div>${frame(p)}</article>`}).join('')}</div>`;gatePhones();
}
function showCoverage(){
 activeReview=null;galleryMode=true;document.body.classList.add('gallery-mode');
 document.querySelector('#stage').innerHTML=`<div class="coverage"><h2>页面覆盖清单</h2><p>本稿以当前 main 工作区的实际 UI 为范围，覆盖主入口、子页面、表单、确认和恢复状态。共 ${pages.length} 个可浏览画面。其数量包含流程状态，不等同于原生路由数量。</p><div class="coverage-note"><strong>设计边界</strong><p>沿用已确认的紧凑样式，深浅色均覆盖全部页面。资源入口右侧显示小数量，搜索按需展开，文字标签用短下划线区分。列表与分组表单优先；高级选项折叠，风险和范围只在需要用户决策时出现。复杂操作保留既有独立确认；设计稿不修改授权、权限、任务归属或自动重试规则。</p><p>R2 Slurper 位于其他工作树，不在此工作区实际入口范围内。Workers 部署、真实域名购买仍为官方入口；购买模拟独立标注。D1 导入、导出、恢复、删除恢复保留生产受限状态。关于页为新增布局提案。</p><p>设置值与表单展示典型分支；DNS 类型字段、站点受控白名单、Sippy 供应商分支均须在原生实现时复用既有 schema。主路径设计不意味着降低确认或允许未支持的操作。</p></div><table><thead><tr><th>区域</th><th>设计画面</th><th>源码依据</th></tr></thead><tbody>${Object.entries(groups).map(([g,name])=>`<tr><td>${name}</td><td>${pages.filter(p=>p.group===g).map(p=>`<button data-catalog="${p.id}">${p.title}${p.mode?'（'+p.mode+'）':''}</button>`).join('')}</td><td>${[...new Set(pages.filter(p=>p.group===g).flatMap(p=>p.sources))].map(s=>`<code>${s}</code>`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`;
}
function navigate(id,fromPhone,trigger){
 const from=fromPhone? pageMap.get(fromPhone.dataset.page):pageMap.get(current);saveDraft(fromPhone);
 if(reviewEntries.has(id)&&from&&!reviewEntries.has(from.id)&&!reviewLater.has(from.id)){for(const key of [...reviewEntries,...reviewLater])drafts.delete(key);activeReview=captureReview(from,fromPhone,id,trigger);}
 else if(!reviewLater.has(id)&&!reviewEntries.has(id))activeReview=null;
 renderPage(id);
}
document.addEventListener('click',e=>{
 const target=e.target.closest('button');if(!target||target.disabled)return;
 const phone=target.closest('.phone');
 if(target.hasAttribute('data-toggle-search')){toggleSearch(phone,target.getAttribute('aria-expanded')!=='true');return}
 if(target.hasAttribute('data-close-search')){toggleSearch(phone,false);return}
 if(target.hasAttribute('data-status-filter')){phone.querySelectorAll('[data-status-filter]').forEach(b=>{b.classList.toggle('active',b===target);b.setAttribute('aria-pressed',String(b===target))});applyListFilter(phone);return}
 if(target.hasAttribute('data-catalog')){activeReview=null;renderPage(target.dataset.catalog);return}
 if(target.hasAttribute('data-coverage')){showCoverage();return}
 if(target.hasAttribute('data-go')){navigate(target.dataset.go,target.closest('.phone'),target);return}
 if(target.hasAttribute('data-demo')){notify(target.dataset.demo);return}
 if(target.hasAttribute('data-reveal')){const privateEl=target.closest('.scroll').querySelector('[data-private]');privateEl.textContent=privateEl.dataset.open?'内容已隐藏':target.dataset.reveal;privateEl.dataset.open=privateEl.dataset.open?'':'true';target.textContent=privateEl.dataset.open?'隐藏内容':'显示内容';}
});
document.addEventListener('input',e=>{gatePhones();if(e.target.matches('[data-local-filter]'))applyListFilter(e.target.closest('.phone'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.matches('[data-local-filter]')){e.preventDefault();toggleSearch(e.target.closest('.phone'),false)}});
document.addEventListener('change',e=>{gatePhones();if(e.target.id==='board-select')renderBoard(e.target.value)});
document.querySelector('#filter').oninput=renderCatalog;
document.querySelector('#theme').onclick=e=>{const on=document.body.classList.toggle('light');e.currentTarget.textContent=on?'深色':'浅色';e.currentTarget.setAttribute('aria-pressed',on)};
document.querySelector('#font').onclick=e=>{const on=document.body.classList.toggle('large');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'标准字号':'大字号'};
document.querySelector('#viewport').onchange=e=>document.documentElement.style.setProperty('--phone-height',`${e.target.value}px`);
document.querySelector('#gallery').onclick=()=>galleryMode?renderPage(current,false):renderBoard();
window.addEventListener('hashchange',()=>{if(pageMap.has(location.hash.slice(1))&&location.hash.slice(1)!==current){activeReview=null;renderPage(location.hash.slice(1),false)}});
if(params.get('theme')==='light')document.querySelector('#theme').click();
if(params.get('font')==='large')document.querySelector('#font').click();
if(params.get('height')==='640'){document.querySelector('#viewport').value='640';document.querySelector('#viewport').dispatchEvent(new Event('change'))}
if(params.has('solo'))document.body.classList.add('solo');
if(params.get('board')){if(params.get('clean')==='1')document.body.classList.add('board-only');renderBoard(params.get('board'))}else if(params.has('coverage'))showCoverage();else renderPage(params.get('page')||params.get('solo')||location.hash.slice(1)||'overview',false);
// Read-only metadata for local design checks, no cloud calls.
window.designPreview={pages:pages.map(({id,group,title,mode,sources})=>({id,group,title,mode,sources})),boards,renderPage,renderBoard,showCoverage};
</script>
