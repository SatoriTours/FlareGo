name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: '明确发布测试版（创建或移动 latest Tag，仅限 main）'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: android-publish
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: CI contract tests
        run: python3 -m unittest discover -s tools/ci/tests -v
      - name: Prepare signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/ci/prepare_signing.py
      - name: Allocate Android version
        if: github.event_name != 'pull_request'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/build_metadata.py
      - name: Tests and lint
        run: ./gradlew :shared-core:jvmTest :android-platform:testDebugUnitTest :app:lintDebug :android-platform:lintDebug :app:assembleDebug --no-daemon
      - name: Signed Android APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          ./gradlew :app:assembleRelease -Pflarego.versionName="$VERSION_NAME" -Pflarego.versionCode="$VERSION_CODE" --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
      - name: Prepare integrity files
        if: github.event_name != 'pull_request'
        run: python3 tools/ci/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: flarego-signed-android-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/flarego-release.jks"

  publish:
    needs: build
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish_snapshot && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flarego-signed-android-${{ github.run_number }}
          path: dist/
      - name: Publish explicitly requested version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_SNAPSHOT: ${{ inputs.publish_snapshot }}
        run: python3 tools/ci/publish.py
