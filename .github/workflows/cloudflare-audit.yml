name: Cloudflare audit

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: '可选：cloudflare/api-schemas 的完整 40 位提交，用于生成候选 schema diff（留空只做固定基线检查）'
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SCHEMA_COMMIT: 6b00f157496cd6a1792a613dc94654c51273aeb9
      SCHEMA_SHA256: 06dbba919204662d42e758e1f5b1dc4e262e99ec8540e7bf564de920707b9461
      SCHEMA_URL: https://raw.githubusercontent.com/cloudflare/api-schemas/6b00f157496cd6a1792a613dc94654c51273aeb9/openapi.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Snapshot the reviewed tree before any audit step
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/status-before.txt"
          python3 - "$RUNNER_TEMP/tree-before.txt" <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout.split(b"\0")
          lines = []
          for raw in sorted(item for item in tracked if item):
              path = pathlib.Path(raw.decode())
              digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else "<missing>"
              lines.append(f"{digest}  {path}")
          pathlib.Path(sys.argv[1]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"snapshotted {len(lines)} tracked files")
          PY

      - name: Report the runner python
        run: python3 --version

      - name: Fetch the pinned public schema and verify its checksum
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/cf-schema-cache/${SCHEMA_COMMIT}-${SCHEMA_SHA256}"
          mkdir -p "$cache_dir"
          schema_file="${cache_dir}/openapi.json"
          if [ ! -s "$schema_file" ]; then
            echo "downloading the pinned public schema (no credentials, no cloud auth headers)"
            curl --fail --silent --show-error --location "$SCHEMA_URL" --output "${schema_file}.download"
            mv "${schema_file}.download" "$schema_file"
          else
            echo "reusing a same-job cached schema file; its checksum is still verified below"
          fi
          sha256sum "$schema_file"
          printf '%s  %s\n' "$SCHEMA_SHA256" "$schema_file" | sha256sum --check --strict -
          echo "SCHEMA_FILE=$schema_file" >> "$GITHUB_ENV"

      - name: Run Cloudflare audit unit tests
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/audit-tests.log"
          python3 -m unittest discover -s tools/cloudflare_audit/tests -p 'test_*.py' -v 2>&1 | tee "$log"
          grep -q '^OK' "$log"
          if grep -q 'NO TESTS RAN' "$log"; then
            echo "audit test discovery ran no tests" >&2
            exit 1
          fi

      - name: Run repository CI unit tests
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/ci-tests.log"
          python3 -m unittest discover -s tools/ci/tests -p 'test_*.py' -v 2>&1 | tee "$log"
          grep -q '^OK' "$log"
          if grep -q 'NO TESTS RAN' "$log"; then
            echo "repository CI test discovery ran no tests" >&2
            exit 1
          fi

      - name: Verify the pinned snapshot is reproducible
        env:
          REGEN_DIR: ${{ runner.temp }}/cf-regen
        run: |
          set -euo pipefail
          python3 -m tools.cloudflare_audit.cli generate \
            --schema "$SCHEMA_FILE" \
            --manifest docs/cloudflare-audit/snapshot.json \
            --implemented docs/cloudflare-audit/implemented.json \
            --output "$REGEN_DIR"
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          regen = pathlib.Path(os.environ["REGEN_DIR"])
          committed = pathlib.Path("docs/cloudflare-audit")
          problems = []
          for name in ("endpoints.csv", "products.csv", "snapshot.json"):
              generated = (regen / name).read_bytes().replace(b"\r\n", b"\n")
              checked_in = (committed / name).read_bytes().replace(b"\r\n", b"\n")
              if generated != checked_in:
                  problems.append(name)
          if problems:
              print("generated artifacts differ from the reviewed baseline: " + ", ".join(problems), file=sys.stderr)
              sys.exit(1)
          print("pinned snapshot reproduces the reviewed baseline (CRLF-normalized)")
          PY
          git diff --exit-code -- docs/cloudflare-audit

      - name: Check the review ledger against the pinned schema
        run: |
          set -euo pipefail
          python3 -m tools.cloudflare_audit.cli check \
            --review docs/cloudflare-audit/review.json \
            --catalog docs/cloudflare-audit/endpoints.csv \
            --schema "$SCHEMA_FILE"

      - name: Report a candidate schema diff
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_commit != '' }}
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          if ! python3 -c "import re, sys; sys.exit(0 if re.fullmatch(r'[0-9a-f]{40}', sys.argv[1]) else 1)" "$CANDIDATE_COMMIT"; then
            echo "candidate_commit must be exactly 40 lowercase hex characters" >&2
            exit 1
          fi
          candidate_url="https://raw.githubusercontent.com/cloudflare/api-schemas/${CANDIDATE_COMMIT}/openapi.json"
          curl --fail --silent --show-error --location "$candidate_url" --output "${RUNNER_TEMP}/candidate.json"
          sha256sum "${RUNNER_TEMP}/candidate.json"
          python3 -m tools.cloudflare_audit.cli diff \
            --old "$SCHEMA_FILE" \
            --new "${RUNNER_TEMP}/candidate.json" \
            --output "${RUNNER_TEMP}/candidate-diff.json"
          cat "${RUNNER_TEMP}/candidate-diff.json"
          echo "candidate diff is review evidence only; the fixed manifest, ledger and policies are untouched"

      - name: Prove no reviewed artifact was modified
        if: always()
        run: |
          set -euo pipefail
          echo "whole-project status at the end of the job:"
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/status-after.txt"
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import sys

          runner = pathlib.Path(os.environ["RUNNER_TEMP"])

          def tree_snapshot():
              tracked = subprocess.run(
                  ["git", "ls-files", "-z"], capture_output=True, check=True
              ).stdout.split(b"\0")
              lines = []
              for raw in sorted(item for item in tracked if item):
                  path = pathlib.Path(raw.decode())
                  digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else "<missing>"
                  lines.append(f"{digest}  {path}")
              return lines

          before = (runner / "tree-before.txt").read_text(encoding="utf-8").splitlines()
          after = tree_snapshot()
          (runner / "tree-after.txt").write_text("\n".join(after) + "\n", encoding="utf-8")
          problems = []
          if before != after:
              changed = sorted(set(before) ^ set(after))
              problems.append("tracked file contents changed during the job: " + ", ".join(changed[:10]))
          if (runner / "status-before.txt").read_text(encoding="utf-8") != (
              runner / "status-after.txt"
          ).read_text(encoding="utf-8"):
              problems.append("repository status changed during the job")
          if problems:
              for problem in problems:
                  print("error: " + problem, file=sys.stderr)
              sys.exit(1)
          print(
              "no reviewed artifact changed during the job "
              "(any pre-existing dirt is preserved, contents are byte-identical)"
          )
          PY
